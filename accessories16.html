<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>جذور - فنجان الكرم للقهوة العربية                        </title>

    <link rel="stylesheet" href="product-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- 1️⃣ استدعاء مكتبة Google Model Viewer لعرض الـ AR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
    <div class="mobile-container">
        <div class="product-image-banner">
            <a href="accessories.html" class="back-arrow-btn">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <img src="img.ac/png16.png" alt="  فنجان الكرم للقهوة العربية           " class="product-bg-img">
        </div>
        <div class="product-details-card">
            <h1 class="product-title">     فنجان الكرم للقهوة العربية   </h1>
            <span class="product-price">35$</span>
            <div class="heritage-divider">
                <span class="line-segment"></span>
                <img src="img/png4.png" class="heritage-icon" alt="نقشة تطريز رام الله">
                <span class="line-segment"></span>
            </div>
            <p class="product-description">فنجان قهوة سادة يدمج بين بساطة التصميم المودرن وعراقة التفاصيل التراثية، حيث تكسو واجهته تفاصيل غنية باللون الأحمر التراثي الزاهي. القطعة المثالية لتقديم قهوتكم بروح الأصالة وجذور الأرض.



            </p>
            <div class="info-grid">
                <div class="info-column">
                    <div class="icon-wrapper">
                        <i class="fa-solid fa-circle-plus"></i>
                    </div>
                    <h4>الشحن</h4>
                    <p>شحن مجاني داخل فلسطين</p>
                </div>
                <div class="vertical-divider"></div>
                <div class="info-column">
                    <div class="icon-wrapper">
                        <i class="fa-solid fa-box-open"></i>
                    </div>
                    <h4>وقت التصنيع</h4>
                    <p>6-8 أسابيع</p>
                </div>
            </div>


    <!-- زر التصميم الخاص بكِ الذي يضغط عليه المستخدم -->
    <button class="ar-button" onclick="activateAR()">
        <span>عرض في غرفتي</span>
        <i class="fa-solid fa-expand"></i>
    </button>
        </div>
    </div>
</body>
</html>
